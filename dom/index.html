<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ett litet formulär</title>
    <script src="./js/script.js" defer></script>
</head>
<body>
  <!-- ===== COUNTER ===== -->
  <h2>Counter</h2>
  <p id="count">0</p>
  <button id="minus">−1</button>
  <button id="plus">+1</button>
  <button id="reset">Nollställ</button>

  <!-- ===== TOGGLE ===== -->
  <h2>Toggle</h2>
  <button id="toggle">Visa text</button>
  <p id="secret" class="hidden">Hej! Nu syns jag 👋</p>

  <!-- ===== FORM ===== -->
    <form id="myForm">
        <label for="value1">Value 1:</label>
        <input type="number" id="value1" name="value1">
        <label for="value2">Value 2:</label>
        <input type="number" id="value2" name="value2">
        <button type="submit">Räkna</button>
    </form>
    <p>Här kommer resultatet: <span id="sum"></span></p>
</body>
</html>
